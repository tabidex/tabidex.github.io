# ==================================================================
#  旅の設定ファイル No.A02（過去の旅）
#  ・今は地名と日付が空なので「準備中」のページです（QRコードは使えます）。
#    旅の内容が決まったら、place_en・place_ja・start・end・color を書き込んでください。
#    書き込むと、トップページの一覧にも表示されます。
#  ・「#」から右側はメモ（説明）です。サイトには表示されません。
#  ・「項目名: 値」の「:」は半角、そのあとに半角スペースを1つ入れます。
#  ・くわしい手順は README.md を見てください。
# ==================================================================

# 旅の番号。ファイル名と同じ番号にします（002.yml なら "002"、A02.yml なら "A02"）。
#   ふだんの旅：001〜999（トップページの「旅の記録」に並びます）
#   過去の旅　：A01〜A99（トップページの「過去の旅の記録」に並びます）
# この番号がページのURL（tabidex.github.io/trip/002/）とQRコードになります。
# ※カードを印刷したあとは、番号もファイル名も変えないでください。
number: "A02"

# 英語の地名。半角の英字で書きます。表紙でいちばん大きく表示されます。
place_en: "Ishigaki"

# 日本語の地名。
place_ja: "石垣島"

# 旅の始まりの日と終わりの日（年-月-日、半角数字）。
# 表示は自動で「2025.09.25 - 09.28」のような形になります。日帰りなら同じ日付を書きます。
start: "2025.09.25"
end: ""2025.09.28

# テーマカラー（表紙・一覧のカード・QRコードの色）。「#」と6けたの英数字で書きます。
# ※「#」から後ろはメモ扱いになってしまうので、必ず " " で囲んでください。
# ※明るい色にすると、文字は自動で濃い色になります。
color: "#3476CC"

# 一言（1〜3行）。「|」の次の行から、行の先頭に半角スペースを2つ入れて書きます。
# まだ書かないときは、「message: ""」にしておけばOKです（表紙に表示されません）。
message: "さおりんと初旅行！！！"

# Googleフォトのアルバムのアドレス（URL）。
# パソコンなどのブラウザでアルバムを開き、上のアドレスバーのURLをそのまま貼り付けます。
#   形の例：https://photos.google.com/album/〜
#   （https://photos.google.com/share/〜 の形でもOKです）
# アルバムは「招待した家族だけが見られる」設定なので、家族以外が押しても中身は見られません。
# まだ無いときは "" のままでOK（ボタンが「動画は準備中です」になります）。
album_url: ""

# QRコードの色。「#」と6けたの英数字で、" " で囲んで書きます（黒なら "#000000"）。
# "" のままにすると、テーマカラーと同じ色になります。
# ※色やアイコンを変えるとQRの見た目も変わります。印刷の前に、QRを保存し直してください。
qr_color: "#000000"

# QRコードの真ん中に入れるアイコン。旅で使った乗り物を、次の4つから選びます。
#   plane（飛行機） / car（車） / train（電車） / ship（船）
#   「飛行機」「車」「電車」「船」と日本語で書いてもOKです。
# アイコンをなしにするときは "" にします。
qr_icon: "plane"
